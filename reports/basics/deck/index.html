<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #08090C;
    overflow: hidden;
    font-family: -apple-system, sans-serif;
  }
  #stage {
    position: fixed;
    top: 0; left: 0;
    transform-origin: top left;
    will-change: transform;
    background: #fff;
    box-shadow: 0 16px 80px rgba(0,0,0,0.6);
  }
  iframe {
    width: 100%; height: 100%;
    border: 0; display: block;
    background: #F6F5F1;
  }
  .counter {
    position: fixed;
    bottom: 24px; right: 24px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 0.06em;
    font-family: 'JetBrains Mono', monospace;
    z-index: 100;
    user-select: none;
    opacity: 0.7;
    transition: opacity 0.2s;
    font-variant-numeric: tabular-nums;
  }
  .counter:hover { opacity: 1; }
  .counter .lbl { color: rgba(255,255,255,0.6); margin-left: 10px; font-size: 12px; }
  .nav-zone {
    position: fixed;
    top: 0; bottom: 0;
    width: 12%;
    cursor: pointer;
    z-index: 50;
  }
  .nav-zone.left  { left: 0; }
  .nav-zone.right { right: 0; }
  .nav-hint {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    opacity: 0;
    transition: opacity 0.2s;
    backdrop-filter: blur(4px);
  }
  .nav-zone.left  .nav-hint { left: 18px; }
  .nav-zone.right .nav-hint { right: 18px; }
  .nav-zone:hover .nav-hint { opacity: 1; }

  @media print {
    @page { size: 1920px 1080px; margin: 0; }
    html, body { background: #fff; overflow: visible; height: auto; }
    #stage { position: static; transform: none !important; box-shadow: none; }
    .counter, .nav-zone { display: none !important; }
    .print-stack { display: block; }
    .print-stack iframe { width: 1920px; height: 1080px; page-break-after: always; display: block; }
  }
</style>
</head>
<body>

<div id="stage">
  <iframe id="frame" src="about:blank"></iframe>
</div>

<div class="nav-zone left"  id="navL"><div class="nav-hint">‹</div></div>
<div class="nav-zone right" id="navR"><div class="nav-hint">›</div></div>
<div class="counter" id="counter">1 / 34</div>

<div class="print-stack" id="printStack" style="display:none;"></div>

<script>
(function () {
  const W = window.DECK_WIDTH || 1920;
  const H = window.DECK_HEIGHT || 1080;
  const deck = window.DECK_MANIFEST || [];
  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  const ctr   = document.getElementById('counter');
  const printStack = document.getElementById('printStack');
  const storeKey = 'deck-ea-' + location.pathname;
  let cur = 0;

  stage.style.width  = W + 'px';
  stage.style.height = H + 'px';

  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    const x = (window.innerWidth  - W * s) / 2;
    const y = (window.innerHeight - H * s) / 2;
    stage.style.transform = `translate(${x}px,${y}px) scale(${s})`;
    stage.style.top = '0';
    stage.style.left = '0';
  }

  function show(idx) {
    if (idx < 0 || idx >= deck.length) return;
    cur = idx;
    frame.src = deck[idx].file;
    ctr.innerHTML = `${idx+1} / ${deck.length}<span class="lbl">${deck[idx].label || ''}</span>`;
    try { localStorage.setItem(storeKey, String(idx)); } catch(_){}
    history.replaceState(null, '', '#' + (idx+1));
  }

  function next() { show(Math.min(cur+1, deck.length-1)); }
  function prev() { show(Math.max(cur-1, 0)); }

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown')  { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp')                  { e.preventDefault(); prev(); }
    else if (e.key === 'Home')                                              { e.preventDefault(); show(0); }
    else if (e.key === 'End')                                               { e.preventDefault(); show(deck.length-1); }
    else if (e.key === 'p' || e.key === 'P')                               { window.print(); }
    else if (e.key >= '1' && e.key <= '9') {
      const i = parseInt(e.key,10) - 1;
      if (i < deck.length) { e.preventDefault(); show(i); }
    }
  });

  document.getElementById('navL').addEventListener('click', prev);
  document.getElementById('navR').addEventListener('click', next);
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', () => {
    const m = location.hash.match(/^#(\d+)$/);
    if (m) show(Math.min(parseInt(m[1],10)-1, deck.length-1));
  });

  const hm = location.hash.match(/^#(\d+)$/);
  if (hm) cur = Math.min(parseInt(hm[1],10)-1, deck.length-1);
  else try {
    const v = parseInt(localStorage.getItem(storeKey),10);
    if (!isNaN(v) && v >= 0 && v < deck.length) cur = v;
  } catch(_){}

  fit();
  show(cur);

  window.addEventListener('beforeprint', () => {
    printStack.innerHTML = '';
    deck.forEach(item => {
      const f = document.createElement('iframe');
      f.src = item.file;
      printStack.appendChild(f);
    });
    printStack.style.display = 'block';
    stage.style.display = 'none';
  });
  window.addEventListener('afterprint', () => {
    printStack.innerHTML = '';
    printStack.style.display = 'none';
    stage.style.display = '';
  });
})();
</script>
</body>
